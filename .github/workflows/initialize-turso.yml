name: Initialize SuryaDesk Turso database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type INITIALIZE-SURYADESK to create the schema and seed the empty demo database
        required: true
        type: string

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Require explicit confirmation and credentials
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "INITIALIZE-SURYADESK" ]; then
            echo "Confirmation text did not match. No database changes were made."
            exit 1
          fi
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "Add TURSO_DATABASE_URL and TURSO_AUTH_TOKEN under GitHub Actions repository secrets."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and generate Prisma Client
        env:
          DATABASE_URL: file:./db/custom.db
        run: bun install --frozen-lockfile

      - name: Generate initial SQL from the checked-in Prisma schema
        env:
          DATABASE_URL: file:./db/custom.db
        run: |
          bunx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output /tmp/suryadesk-schema.sql
          test -s /tmp/suryadesk-schema.sql

      - name: Apply schema to the empty Turso database
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/apply-turso-schema.mjs /tmp/suryadesk-schema.sql

      - name: Seed demo records
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DEMO_MODE: "true"
        run: bun prisma/seed.ts

      - name: Verify seeded records
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/verify-turso-seed.mjs
